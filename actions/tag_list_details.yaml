---
name: tag_list_details
runner_type: python-script
description: List all tags from a given category or all tags with full details (name, description, category_id)
enabled: true
entry_point: tag_list_details.py
parameters:
    category_name:
        type: 'string'
        description: Category to list tags from (optional - if not provided, all tags are returned)
        required: false
    vsphere:
        type: "string"
        description: Pre-Configured vsphere connection details
        required: false
        default: ~
